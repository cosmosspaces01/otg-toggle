name: Build APK

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Debug APK (always runs on push / PR)
  # ────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required for Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Gradle packages for faster subsequent builds
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 5. Make gradlew executable (Linux requirement)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Generate Gradle wrapper JAR (if not committed)
      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.2
          fi

      # 7. Build debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

      # 8. Upload debug APK as a workflow artifact (downloadable from Actions tab)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OTG-Toggle-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # 9. Print APK info
      - name: APK Info
        run: |
          echo "✅ Debug APK built successfully!"
          ls -lh app/build/outputs/apk/debug/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Sign Release APK (only on push to main/master or tags)
  # ────────────────────────────────────────────────────────────────────────────
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    # Only run on push to main/master (not on PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))

    # Map secrets to env vars at the job level so `if:` conditions can read them
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.2
          fi

      # ── Option A: Unsigned release (no keystore secrets configured) ─────────
      - name: Build Unsigned Release APK
        if: env.HAS_KEYSTORE == 'false'
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"

      # ── Option B: Signed release (when KEYSTORE secrets are configured) ─────
      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Build Signed Release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --stacktrace --no-daemon

      # Upload release APK artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: OTG-Toggle-Release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      # Create a GitHub Release with the APK attached (only on tag push)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release*.apk
          name: OTG Toggle ${{ github.ref_name }}
          body: |
            ## OTG Toggle ${{ github.ref_name }}
            
            ### Install
            Download `app-release.apk` below and install it on your Android device.
            
            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
